name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Compact compiler (if available)
        run: |
          if command -v compact &> /dev/null; then
            echo "Compact compiler found"
          elif [ -f "$HOME/.local/bin/compact" ]; then
            echo "Compact compiler found at $HOME/.local/bin/compact"
          else
            echo "Compact compiler not available in CI — skipping contract compilation"
          fi

      - name: Compile Compact smart contract (if compiler available)
        run: |
          if command -v compact &> /dev/null; then
            npm run compile
          elif [ -f "$HOME/.local/bin/compact" ]; then
            npm run compile
          else
            echo "Skipping Compact compilation — compiler not available in CI runner"
            echo "Compiled artifacts are committed to the repository"
          fi
        continue-on-error: true

      - name: Verify compiled contract artifacts exist
        run: |
          if [ -f "contracts/managed/clinical-trial/index.cjs" ]; then
            echo "✅ Compiled contract artifacts present"
          else
            echo "⚠️  Compiled contract artifacts missing — run: npm run compile"
            exit 1
          fi

      - name: Run test suite
        run: npm test

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_NETWORK: undeployed
          VITE_CONTRACT_ADDRESS: dec3b071d373ec575648e0c5dfee659710312616875db1fb6cd84a06c7cc6dd2
          VITE_PROOF_SERVER_URL: http://127.0.0.1:6300
