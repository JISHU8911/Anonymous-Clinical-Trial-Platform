name: Anonymous Clinical Trial Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    name: Build, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Compile Compact Smart Contract
        run: |
          if command -v compact &> /dev/null; then
            npm run compile
          elif [ -f "/home/zeal/.local/bin/compact" ]; then
            /home/zeal/.local/bin/compact compile contracts/clinical-trial.compact contracts/managed/clinical-trial
          else
            echo "Compact compiler not in PATH on runner; verifying pre-generated managed contract artifacts."
            test -f contracts/managed/clinical-trial/contract/index.js
          fi

      - name: Run Automated Unit & Privacy Tests
        run: npm test

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Type-Check and Build Frontend App
        run: |
          cd frontend
          npm run build
